<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>创作仓库 · Dashboard</title>
<style>
:root{--bg:#f5f3f0;--paper:#fff;--ink:#292725;--muted:#756e69;--accent:#795875;--line:#dfd9d3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button,select,.button{border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:8px 12px;cursor:pointer}button:hover,.button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bb95b9;outline-offset:3px}a{color:var(--accent)}.shell{max-width:1700px;margin:auto;padding:40px 32px 110px}.eyebrow{font-size:11px;letter-spacing:.19em;color:var(--accent)}h1{font-weight:550;font-size:clamp(26px,4vw,40px);letter-spacing:-.04em;margin:5px 0 9px}h2,h3,h4{line-height:1.4}h2{font-size:20px}h3{font-size:17px}.muted{color:var(--muted)}.intro{margin:0 0 24px;color:var(--muted)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.nav{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding:20px 0}.nav button{background:transparent}.nav .active{background:var(--accent);color:white;border-color:var(--accent)}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.tools input{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:white;min-width:230px}.count{margin-left:auto;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{border:1px solid var(--line);background:var(--paper);border-radius:13px;overflow:hidden;min-width:0}.card.selected{box-shadow:0 0 0 2px var(--accent)}.photo{width:100%;padding:0;border:0;border-radius:0;background:#e8e3df;position:relative;display:block}.photo img{display:block;width:100%;aspect-ratio:2/3;object-fit:contain}.placeholder{display:grid;place-items:center;min-height:180px;padding:24px;white-space:pre-wrap;word-break:break-word;color:var(--muted)}.badge{position:absolute;left:10px;top:10px;max-width:90%;padding:3px 8px;border-radius:5px;background:#fffffff0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info{padding:15px}.info h3{margin:0 0 6px}.model{font-size:13px;color:var(--accent)}.meta{color:var(--muted);font-size:12px;margin:5px 0 10px}.note{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px}.actions label{cursor:pointer;display:flex;align-items:center;gap:5px}.actions button{font-size:12px;padding:4px 9px}.actions input{accent-color:var(--accent);width:16px;height:16px}.empty{grid-column:1/-1;padding:80px 24px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);white-space:pre-line}.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:white;border:1px solid var(--line);padding:10px 16px;border-radius:13px;box-shadow:0 8px 32px #332a241a;max-width:95vw;white-space:nowrap;z-index:2}.primary{background:var(--accent);color:white;border-color:var(--accent)}.foot{margin-top:28px;color:var(--muted);font-size:12px}.notice{background:#fff4df;border:1px solid #e6d4b3;border-radius:10px;padding:12px 16px;margin:12px 0;font-size:13px;overflow-wrap:anywhere}.hidden{display:none!important}dialog{background:var(--bg);color:var(--ink);border:0;border-radius:14px;padding:0;max-width:1550px;width:calc(100% - 36px);max-height:94vh}dialog::backdrop{background:#19121ac4}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}.dialoghead h2{font-size:17px;margin:0}.view{display:grid;gap:16px;padding:20px;align-items:start}.view figure{margin:0;min-width:0}.view img{width:100%;height:65vh;object-fit:contain;background:#e8e3df;border-radius:8px}.view figcaption{font-size:13px;margin-top:10px;overflow-wrap:anywhere;white-space:pre-wrap}.detailbody{padding:0 24px 28px;overflow-wrap:anywhere}.step{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:20px 0}.step h3{margin-top:0}.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}.strip figure{margin:0}.strip img{width:100%;height:210px;object-fit:contain;background:var(--bg);border-radius:7px}.strip button{padding:0;border:0;width:100%;display:block}.strip figcaption{font-size:12px;margin:6px 0 12px;white-space:pre-wrap}.text{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f4f2;padding:14px;border-radius:8px;font:12px/1.8 ui-monospace,SFMono-Regular,monospace;max-height:420px;overflow:auto}details{margin:14px 0}summary{cursor:pointer;color:var(--accent)}.detailbody p{white-space:pre-wrap}.taskname{font-size:12px;color:var(--muted);margin-bottom:6px}.toast{color:var(--accent);font-size:12px;min-height:22px}body:has(dialog[open]){overflow:hidden}@media(min-width:1400px){.grid.compact{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.shell{padding:25px 15px 130px}.top{align-items:start}.top button{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{padding:12px}.info h3{font-size:15px}.tools input{min-width:0;width:100%}.count{margin-left:0}.dock{font-size:12px;gap:6px;padding:8px}.dock button{padding:7px}.view{overflow:auto;grid-template-columns:repeat(var(--n),minmax(250px,1fr))!important}.view img{height:60vh}.detailbody{padding:0 14px 20px}.step{padding:14px}}@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s,background .15s}}
</style></head><body><main class="shell"><header><div class="eyebrow">REFERENCE IMAGE STUDIO / PROJECT DASHBOARD</div><div class="top"><h1 id="title"></h1><button id="reload">刷新页面 ↻</button></div><p class="intro">查看可信参考、每次创作的输入与产出，以及明确保留的版本。</p></header><nav class="nav" id="nav" aria-label="素材分类"></nav><div id="warnings"></div><div class="tools"><input id="search" type="search" placeholder="搜索标题、编号、模型、说明" aria-label="搜索素材"><select id="model" aria-label="模型筛选"><option value="all">全部模型</option></select><select id="state" aria-label="参考状态"><option value="confirmed">已确认参考</option><option value="all">全部参考状态</option><option value="provisional">待确认</option><option value="superseded">已替代</option></select><button id="density">紧凑布局</button><span class="count" id="count" role="status"></span></div><div id="grid" class="grid"></div><p class="foot" id="footer"></p><div class="toast" id="toast" role="status"></div></main><div class="dock"><span id="selection" aria-live="polite"></span><button id="compare" class="primary" disabled>并排对比</button><button id="copy" disabled>复制所选编号</button><button id="clear">清空</button></div><dialog id="viewer" aria-labelledby="viewtitle"><div class="dialoghead"><h2 id="viewtitle"></h2><div><button id="prev" aria-label="上一张">←</button> <button id="next" aria-label="下一张">→</button> <button id="viewclose">关闭 ×</button></div></div><div class="view" id="view"></div></dialog><dialog id="detail" aria-labelledby="detailtitle"><div class="dialoghead"><h2 id="detailtitle"></h2><button id="detailclose">关闭 ×</button></div><div class="detailbody" id="detailbody"></div></dialog>
<script>
'use strict';
const project=/*__PROJECT_DATA__*/;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusNames={confirmed:'已确认',provisional:'待确认',superseded:'已替代',retained:'明确保留',planned:'待执行',running:'执行中',completed:'已完成',failed:'失败',cancelled:'已取消',unknown:'未记录'};
const catalog=[],byKey=new Map(),taskMap=new Map(project.tasks.map(t=>[t.id,t]));
let tab='references',selected=new Set(),active=[];
const storageKey='reference-image-dashboard:'+project.title;
function add(item){if(item.asset?.deleted){item.originalSection=item.section;item.section='deleted';item.note=[item.asset.deletion_reason,item.note].filter(Boolean).join('\n')}else if(item.asset?.archived){item.originalSection=item.section;item.section='archived'}catalog.push(item);byKey.set(item.key,item)}
for(const ref of project.references)add({...ref,key:'ref:'+ref.id,section:'references',note:ref.scope,model:'',version:ref.id});
for(const task of project.tasks){let count=0;for(const step of task.steps||[]){for(const output of step.outputs||[]){add({...output,key:`out:${task.id}:${step.id}:${output.id}`,section:'tasks',title:output.title||step.version,version:step.version,model:step.model||'模型未记录',task:task.id,step:step.id,taskTitle:task.title,note:output.review||step.checks||'',status:step.status});count++}if(!(step.outputs||[]).length)add({key:`step:${task.id}:${step.id}`,id:step.id,section:'tasks',title:step.version,version:step.version,task:task.id,step:step.id,taskTitle:task.title,model:step.model||'模型未记录',status:step.status,note:step.error||step.checks||'此尝试尚无输出文件'})}if(!count&&!(task.steps||[]).length)add({key:'task:'+task.id,id:task.id,section:'tasks',task:task.id,title:task.title,version:'尚无尝试',status:task.status,note:task.description||''})}
for(const result of project.retained){const task=taskMap.get(result.origin.task);const step=task?.steps?.find(s=>s.id===result.origin.step);add({...result,key:'kept:'+result.id,section:'retained',version:step?.version||'',model:step?.model||'模型未记录',task:result.origin.task,step:result.origin.step,taskTitle:task?.title||'',note:result.scope})}
for(const item of project.unregistered)add({...item,key:item.id,section:'unregistered',model:'',version:'未登记',note:'未登记来源、用途与任务关系；不作为可信参考。'});
for(const item of project.archives||[]){if(!catalog.some(x=>['archived','deleted'].includes(x.section)&&x.path===item.path))add({...item,key:'archive:'+item.path,id:item.path,title:item.path.split('/').pop(),section:'archived',note:item.reason,version:'已归档'})}
try{const stored=JSON.parse(localStorage.getItem(storageKey)||'{}');selected=new Set((stored.selected||[]).filter(k=>(byKey.get(k)?.asset?.image&&!byKey.get(k)?.asset?.deleted)).slice(0,4));if(['references','tasks','retained','unregistered','archived','deleted'].includes(stored.tab))tab=stored.tab}catch(e){}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({selected:[...selected],tab}))}catch(e){}$('selection').textContent=`已选 ${selected.size} / 4 张`;$('compare').disabled=selected.size<2;$('copy').disabled=!selected.size}
function navigation(){const labels={references:'可信参考',tasks:'任务与尝试',retained:'保留结果',unregistered:'未登记素材',archived:'已归档',deleted:'已删除'};$('nav').innerHTML=Object.entries(labels).map(([key,label])=>`<button data-tab="${key}" class="${tab===key?'active':''}" aria-pressed="${tab===key}">${label} <span>${catalog.filter(x=>x.section===key).length}</span></button>`).join('');for(const b of $('nav').querySelectorAll('button'))b.onclick=()=>{tab=b.dataset.tab;$('model').value='all';navigation();render()}}
function visible(){const q=$('search').value.toLowerCase();return catalog.filter(x=>x.section===tab&&($('model').value==='all'||x.model===$('model').value)&&(tab!=='references'||$('state').value==='all'||x.status===$('state').value)&&(!q||[x.id,x.title,x.version,x.taskTitle,x.model,x.note,x.path].join(' ').toLowerCase().includes(q)))}
function render(){$('state').classList.toggle('hidden',tab!=='references');const list=visible();$('count').textContent=`显示 ${list.length} 项`;$('grid').replaceChildren();for(const item of list){const a=item.asset,card=document.createElement('article');card.className='card'+(selected.has(item.key)?' selected':'');const hasImage=a?.exists&&a?.image&&!a?.deleted;card.innerHTML=`${hasImage?`<button class="photo" aria-label="放大 ${esc(item.title)}"><img src="${esc(a.thumb)}" alt="${esc(item.title)}" loading="lazy"><span class="badge">${esc(item.id||item.version)}</span></button>`:`<div class="placeholder">${a?.deleted?'已删除':a&&!a.exists?'意外缺失':item.status==='failed'?'本次尝试失败':'暂无图片'}</div>`}<div class="info">${item.taskTitle?`<div class="taskname">${esc(item.taskTitle)}</div>`:''}<h3>${esc(item.title)}</h3><div class="model">${esc(item.model||item.version||'')}</div><div class="meta">${esc([item.version,statusNames[item.status]||item.status,a?.dimensions?.join(' × ')].filter(Boolean).join(' · '))}</div><div class="note">${esc(item.note||'说明未记录')}</div><div class="actions">${hasImage?`<label><input type="checkbox" ${selected.has(item.key)?'checked':''}>对比</label><a href="${esc(a.url)}" target="_blank" rel="noopener">原图 ↗</a>`:''}<button class="details">${item.task?'输入 / 输出 / Prompt':'查看说明'}</button></div></div>`;if(hasImage){card.querySelector('.photo').onclick=()=>showImages([item]);card.querySelector('input').onchange=e=>{if(e.target.checked&&selected.size>=4){e.target.checked=false;$('toast').textContent='最多对比 4 张，请先取消一张。';return}if(e.target.checked)selected.add(item.key);else selected.delete(item.key);card.classList.toggle('selected',selected.has(item.key));$('toast').textContent='';save()}}card.querySelector('.details').onclick=()=>showDetails(item);$('grid').append(card)}if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent={references:'尚无符合条件的参考。\n新增图片需登记来源、适用范围与确认依据。',tasks:'尚无任务记录。\n每次尝试登记输入、模型、prompt 与输出后，会显示在这里。',retained:'尚无明确保留的结果。\n选择对比不会自动改写保留状态。',unregistered:'暂无未登记图片。',archived:'暂无归档结果。',deleted:'暂无主动删除的结果。'}[tab];$('grid').append(empty)}save()}
function showImages(items){active=items;$('viewtitle').textContent=items.length>1?'并排对比':items[0].title;$('prev').hidden=$('next').hidden=items.length!==1;$('view').style.gridTemplateColumns=`repeat(${items.length},minmax(0,1fr))`;$('view').style.setProperty('--n',items.length);$('view').innerHTML=items.map(x=>`<figure><img src="${esc(x.asset.url)}" alt="${esc(x.title)}"><figcaption><strong>${esc(x.id||x.version)} · ${esc(x.title)}</strong><br>${esc(x.model||'')} · ${esc(x.asset.dimensions?.join(' × ')||'尺寸未记录')}<br>${esc(x.note||'')}<br><a href="${esc(x.asset.url)}" target="_blank" rel="noopener">打开原图 ↗</a></figcaption></figure>`).join('');if(!$('viewer').open)$('viewer').showModal()}
function stepImage(offset){if(active.length!==1)return;const list=visible().filter(x=>x.asset?.exists&&x.asset?.image),i=list.findIndex(x=>x.key===active[0].key);if(list.length)showImages([list[(i+offset+list.length)%list.length]])}
function docs(items){return(items||[]).map(d=>`<details><summary>${esc(d.title||d.path||'说明文档')}</summary><pre class="text">${esc(d.text)}</pre>${d.asset?.exists?`<a href="${esc(d.asset.url)}" target="_blank" rel="noopener">打开文档 ↗</a>`:''}</details>`).join('')}
function strip(items,task,step,isInput){return `<div class="strip">${items.map((x,i)=>{const a=x.asset;const key=isInput?`input:${task.id}:${step.id}:${i}`:`out:${task.id}:${step.id}:${x.id}`;if(isInput)byKey.set(key,{...x,key,title:x.role,model:'输入',asset:a});return `<figure>${a?.exists&&a?.image&&!a?.deleted?`<button data-image="${esc(key)}" aria-label="放大 ${esc(x.role||x.title||x.id)}"><img src="${esc(a.thumb)}" alt="${esc(x.role||x.title||x.id)}" loading="lazy"></button>`:`<div class="placeholder">${a?.deleted?'已删除':a?.exists?'文档输入':'意外缺失'}</div>`}<figcaption>${esc(x.role||x.title||x.id)}${isInput?` · ${x.sent===true?'已传工具':x.sent===false?'未传工具，仅查阅':'是否传入未记录'}`:''}<br>${esc(x.path)}${a?.deleted?`<br>${esc(a.deletion_reason)}<br>${esc(a.deleted_at||'')}`:''}${a?.exists&&!a?.deleted?`<br><a href="${esc(a.url)}" target="_blank" rel="noopener">打开文件 ↗</a>`:''}</figcaption></figure>`}).join('')}</div>`}
function showDetails(item){const task=taskMap.get(item.task||item.origin?.task);$('detailtitle').textContent=task?task.title:item.title;let html=docs(item.documents);if(item.confirmation)html+=`<h3>确认与适用范围</h3><p>${esc(item.scope)}\n${esc(item.confirmation)}</p>`;if(item.origin)html+=`<p class="muted">来源：${esc(item.origin.task)} → ${esc(item.origin.step)} → ${esc(item.origin.output)}</p>`;if(task){html+=`<p>${esc(task.description||'')}</p><p class="muted">${esc(task.kind)} · ${esc(statusNames[task.status]||task.status)} · ${esc(task.created_at||'时间未记录')}</p>${docs(task.documents)}`;for(const s of task.steps||[])html+=`<section class="step" id="step-${esc(s.id)}"><h3>${esc(s.version)} <span class="muted">${esc(statusNames[s.status]||s.status)}</span></h3><p>${esc(s.model||'模型未记录')} · ${esc(s.created_at||'时间未记录')}</p>${s.error?`<div class="notice">${esc(s.error)}</div>`:''}<h4>输入与职责</h4>${strip(s.inputs||[],task,s,true)}<h4>输出</h4>${(s.outputs||[]).length?strip(s.outputs,task,s,false):'<p class="muted">本次无输出文件。</p>'}<details open><summary>实际 Prompt</summary><pre class="text">${esc(s.prompt?.text||'未记录')}</pre></details><details><summary>模型参数</summary><pre class="text">${esc(JSON.stringify(s.parameters||{},null,2))}</pre></details><h4>核对与说明</h4><p>${esc(s.checks||'未记录')}</p></section>`}else html+=`<p>${esc(item.note||'说明未记录')}</p><p class="muted">${esc(item.path||'')}</p>`;$('detailbody').innerHTML=html;for(const b of $('detailbody').querySelectorAll('[data-image]'))b.onclick=()=>showImages([byKey.get(b.dataset.image)]);if(!$('detail').open)$('detail').showModal();if(item.step){const section=document.getElementById('step-'+item.step);if(section)section.scrollIntoView({block:'start'})}}
$('title').textContent=project.title;document.title=project.title+' · 创作 Dashboard';
for(const name of [...new Set(catalog.map(x=>x.model).filter(Boolean))]){const o=document.createElement('option');o.value=name;o.textContent=name;$('model').append(o)}
if(project.warnings.length){const warning=document.createElement('details');warning.className='notice';const summary=document.createElement('summary');summary.textContent=`发现 ${project.warnings.length} 项文件异常（展开查看）`;const list=document.createElement('ul');for(const text of project.warnings){const line=document.createElement('li');line.textContent=text;list.append(line)}warning.append(summary);warning.append(list);$('warnings').append(warning)}
$('footer').textContent='本地项目快照 · 每次任务记录或素材变更后由技能重新构建，再刷新页面。单独放入的图片显示在“未登记素材”。对比选择仅保存在当前浏览器，不代表保留或确认。归档结果原位保留；已删除结果仅保留历史记录，不可恢复。意外缺失单独报告。';
for(const id of ['model','state'])$(id).onchange=render;$('search').oninput=render;$('reload').onclick=()=>location.reload();$('compare').onclick=()=>showImages([...selected].map(k=>byKey.get(k)));$('clear').onclick=()=>{selected.clear();render()};$('copy').onclick=async()=>{const text=[...selected].map(k=>{const x=byKey.get(k);return `${x.id||x.key} · ${x.taskTitle||''} · ${x.title} · ${x.model||''}`}).join('\n');try{await navigator.clipboard.writeText(text);$('toast').textContent='已复制所选编号。'}catch(e){window.prompt('复制所选编号：',text)}};$('density').onclick=()=>{$('density').textContent=$('grid').classList.toggle('compact')?'标准布局':'紧凑布局'};$('viewclose').onclick=()=>$('viewer').close();$('detailclose').onclick=()=>$('detail').close();$('prev').onclick=()=>stepImage(-1);$('next').onclick=()=>stepImage(1);for(const id of ['viewer','detail'])$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).close()});document.addEventListener('keydown',e=>{if(!$('viewer').open)return;if(e.key==='ArrowLeft')stepImage(-1);if(e.key==='ArrowRight')stepImage(1)});navigation();render();
</script></body></html>
